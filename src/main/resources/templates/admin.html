<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #c82333;
        }
        .add-user {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .add-user:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
<h1>Admin Panel</h1>

<!-- Ссылка для добавления нового пользователя -->
<a href="/admin/new" class="add-user">Add New User</a>

<!-- Таблица пользователей -->
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Проверка на наличие пользователей -->
    <tr th:if="${users == null || users.isEmpty()}">
        <td colspan="4">No users found</td>
    </tr>
    <!-- Цикл для отображения пользователей -->
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">ID</td>
        <td th:text="${user.username}">Name</td>
        <td th:text="${user.email}">Email</td>
        <td>
            <!-- Кнопка для редактирования -->
            <a th:href="@{/admin/edit/{id}(id=${user.id})}" style="margin-right: 10px;">Edit</a>
            <!-- Кнопка для удаления -->
            <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
