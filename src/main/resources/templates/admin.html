<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #c82333;
        }
        .add-user {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .add-user:hover {
            background-color: #218838;
        }
        .logout {
            float: right;
            background-color: #6c757d;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<h1>Admin Panel</h1>

<form th:action="@{/logout}" method="post" style="float: right; margin-left: 10px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="add-user logout">Logout</button>
</form>

<a href="/admin/new" class="add-user">Add New User</a>


<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Lastname</th>
        <th>Age</th>
        <th>Email</th>
        <th>Roles</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>

    <tr th:if="${users == null || users.isEmpty()}">
        <td colspan="7">No users found</td>
    </tr>

    <tr th:each="user : ${users}">
        <td th:text="${user.id}">ID</td>
        <td th:text="${user.username}">Username</td>
        <td th:text="${user.lastname}">Lastname</td>
        <td th:text="${user.age}">Age</td>
        <td th:text="${user.email}">Email</td>
        <td>
        <span th:each="role, iterStat : ${user.roles}">
            <span th:text="${role.name}"></span><span th:if="${!iterStat.last}">, </span>
        </span>
        </td>
        <td>
            <a th:href="@{/admin/edit/{id}(id=${user.id})}" style="margin-right: 10px;">Edit</a>
            <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
