<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .sidebar {
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            width: 250px;
            background-color: #f8f9fa;
            padding: 20px;
            border-right: 1px solid #dee2e6;
        }
        .content {
            margin-left: 270px;
            padding: 20px;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .main-content {
            margin-top: 60px;
        }
        .nav-link.active {
            font-weight: 500;
            color: #0d6efd;
            background-color: #e7f1ff;
            border-radius: 5px;
        }
        .modal-xl {
            max-width: 800px;
        }
        .modal-header {
            border-bottom: none;
            padding-bottom: 0;
        }
        .modal-title {
            font-size: 1.5rem;
            margin-left: 20px;
            margin-top: 10px;
        }
        .roles-container {
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 10px;
        }
        .alert-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1100;
            min-width: 300px;
        }
        /* Стили для модального окна удаления */
        .modal-content {
            border-radius: 10px;
        }
        .modal-header {
            border-bottom: 1px solid #dee2e6;
            padding: 15px 20px;
        }
        .modal-title {
            font-size: 1.25rem;
            font-weight: 500;
        }
        .modal-body {
            padding: 20px;
        }
        .user-info-row {
            margin-bottom: 15px;
        }
        .user-info-label {
            font-weight: 500;
            margin-bottom: 5px;
        }
        .user-info-value {
            padding: 8px 12px;
            background-color: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .modal-footer {
            border-top: none;
            padding: 15px 20px;
            justify-content: space-between;
        }
    </style>
</head>
<body>
<!-- Шапка -->
<div class="header">
    <div th:if="${currentUser != null}">
        <span th:text="${currentUser.username} + ' with roles: ' + ${#strings.listJoin(currentUser.roles.![name], ' ')}"></span>
    </div>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-link text-white">Logout</button>
    </form>
</div>

<div class="alert-container"></div>

<div class="sidebar">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link active" th:href="@{/admin}">Admin</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/user}">User</a>
        </li>
    </ul>
</div>

<div class="content main-content">
    <h2>Admin panel</h2>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Users table</h4>
        <a th:href="@{/admin/new}" class="btn btn-primary">New User</a>
    </div>

    <h5>All users</h5>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.lastname}"></td>
                <td th:text="${user.age}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span th:each="role : ${user.roles}"
                          th:text="${role.name.replace('ROLE_', '') + ' '}"></span>
                </td>
                <td>
                    <button class="btn btn-sm btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#editUserModal"
                            th:attr="data-user-id=${user.id},
                                     data-user-username=${user.username},
                                     data-user-lastname=${user.lastname},
                                     data-user-age=${user.age},
                                     data-user-email=${user.email},
                                     data-user-roles=${#strings.listJoin(user.roles.![id], ',')}">
                        Edit
                    </button>
                    <button class="btn btn-sm btn-danger"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteUserModal"
                            th:attr="data-user-id=${user.id},
                                     data-user-username=${user.username},
                                     data-user-lastname=${user.lastname},
                                     data-user-age=${user.age},
                                     data-user-email=${user.email},
                                     data-user-roles=${#strings.listJoin(user.roles.![name], ',')}">
                        Delete
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editUserForm" method="post" th:action="@{/admin/update/{id}(id=${editUserId})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" id="editUserId" name="id">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ID</label>
                                <input type="text" class="form-control" id="displayId" readonly>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editUsername" class="form-label">Username</label>
                                <input type="text" class="form-control" id="editUsername" name="username" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editLastname" class="form-label">Last name</label>
                                <input type="text" class="form-control" id="editLastname" name="lastname" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editAge" class="form-label">Age</label>
                                <input type="number" class="form-control" id="editAge" name="age" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="editEmail" name="email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editPassword" class="form-label">Password (leave empty to keep current)</label>
                                <input type="password" class="form-control" id="editPassword" name="password">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Roles</label>
                            <div class="roles-container">
                                <div class="row">
                                    <div th:each="role : ${allRoles}" class="col-md-6 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input role-checkbox" type="checkbox"
                                                   th:id="${'editRole-' + role.id}" th:value="${role.id}"
                                                   name="roles">
                                            <label class="form-check-label" th:for="${'editRole-' + role.id}"
                                                   th:text="${role.name}"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteUserModalLabel">Delete user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="user-info-row">
                        <div class="user-info-label">ID</div>
                        <div class="user-info-value" id="deleteUserIdDisplay"></div>
                    </div>
                    <div class="user-info-row">
                        <div class="user-info-label">First name</div>
                        <div class="user-info-value" id="deleteUserFirstName"></div>
                    </div>
                    <div class="user-info-row">
                        <div class="user-info-label">Last name</div>
                        <div class="user-info-value" id="deleteUserLastName"></div>
                    </div>
                    <div class="user-info-row">
                        <div class="user-info-label">Age</div>
                        <div class="user-info-value" id="deleteUserAge"></div>
                    </div>
                    <div class="user-info-row">
                        <div class="user-info-label">Email</div>
                        <div class="user-info-value" id="deleteUserEmail"></div>
                    </div>
                    <div class="user-info-row">
                        <div class="user-info-label">Role</div>
                        <div class="user-info-value" id="deleteUserRoles"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <form id="deleteUserForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" id="deleteUserId" name="id">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
</body>
</html>
