<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h2>Новый пользователь</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/create}" th:object="${user}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" required>
                </div>

                <div class="mb-3">
                    <label for="lastname" class="form-label">Фамилия</label>
                    <input type="text" class="form-control" id="lastname" th:field="*{lastname}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                </div>

                <div class="mb-3">
                    <label for="age" class="form-label">Возраст</label>
                    <input type="number" class="form-control" id="age" th:field="*{age}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Роли</label>
                    <div th:each="role : ${allRoles}" class="form-check">
                        <input class="form-check-input" type="checkbox"
                               th:id="${'role_' + role.id}"
                               th:value="${role.id}"
                               th:field="*{roles}">
                        <label class="form-check-label" th:for="${'role_' + role.id}" th:text="${role.name}"></label>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Сохранить</button>
                <a href="/admin" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
