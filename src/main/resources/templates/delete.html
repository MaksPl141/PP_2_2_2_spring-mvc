<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">Delete user</h1>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Are you sure you want to delete this user?</h5>
            <div class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" class="form-control" th:value="${user.id}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">First name</label>
                <input type="text" class="form-control" th:value="${user.username}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" class="form-control" th:value="${user.email}" readonly>
            </div>

            <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post">
                <button type="submit" class="btn btn-danger">Delete</button>
                <a th:href="@{/admin}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
