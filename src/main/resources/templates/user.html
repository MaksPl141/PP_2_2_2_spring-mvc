<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>User Page</title>
    <style>
        /* Добавь стили аналогично админке */
        .logout {
            float: right;
            background-color: #6c757d;
            margin-left: 10px;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .logout:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<h1>User Profile</h1>

<form th:action="@{/logout}" method="post" style="float: right; margin-left: 10px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="logout">Logout</button>
</form>

<div>
    <p><strong>ID:</strong> <span th:text="${user.id}">ID</span></p>
    <p><strong>Username:</strong> <span th:text="${user.username}">Username</span></p>
    <p><strong>Lastname:</strong> <span th:text="${user.lastname}">Lastname</span></p>
    <p><strong>Age:</strong> <span th:text="${user.age}">Age</span></p>
    <p><strong>Email:</strong> <span th:text="${user.email}">Email</span></p>
    <p><strong>Roles:</strong>
        <span th:each="role, iterStat : ${user.roles}">
            <span th:text="${role.name}"></span><span th:if="${!iterStat.last}">, </span>
        </span>
    </p>
</div>
</body>
</html>
